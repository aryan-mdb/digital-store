<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 800px; height: 500px; overflow: hidden; }
  body {
    background: #05070d;
    position: relative;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(59,130,246,0.09) 1px, transparent 1px),
      linear-gradient(90deg, rgba(59,130,246,0.09) 1px, transparent 1px);
    background-size: 36px 36px;
  }
  .glow {
    position: absolute;
    width: 480px; height: 480px;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.5;
  }
  .frame {
    position: absolute; inset: 14px;
    border: 2px solid rgba(59,130,246,0.4);
    border-radius: 18px;
  }
  .center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 22px;
  }
  .icon-wrap {
    width: 150px; height: 150px;
    border-radius: 28px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(59,130,246,0.45);
    box-shadow: 0 0 60px -10px var(--accent, rgba(59,130,246,0.8));
  }
  svg { width: 76px; height: 76px; }
  .label {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 1px;
    background: linear-gradient(135deg, #dbeafe 0%, #3b82f6 45%, #1d4ed8 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sub {
    font-size: 14px;
    color: #7c8aa0;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow" id="glow"></div>
  <div class="frame"></div>
  <div class="center">
    <div class="icon-wrap" id="iconWrap">
      <svg id="icon" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></svg>
    </div>
    <div class="label" id="label"></div>
    <div class="sub" id="sub">DIGITAL DOWNLOAD</div>
  </div>

<script>
  const ICONS = {
    software: '<path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5a2 2 0 0 0 2 2h1"/><path d="M16 3h1a2 2 0 0 1 2 2v5a2 2 0 0 0 2 2 2 2 0 0 0-2 2v5a2 2 0 0 1-2 2h-1"/>',
    templates: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/>',
    ebooks: '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
    courses: '<path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>',
    graphics: '<circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/>',
  }
  const ACCENTS = {
    software: '#38bdf8',
    templates: '#818cf8',
    ebooks: '#22d3ee',
    courses: '#60a5fa',
    graphics: '#a78bfa',
  }

  const params = new URLSearchParams(location.search)
  const key = params.get('key') || 'software'
  const label = params.get('label') || 'Digital Product'

  document.getElementById('icon').innerHTML = ICONS[key] || ICONS.software
  document.getElementById('label').textContent = label
  document.getElementById('glow').style.background = ACCENTS[key] || ACCENTS.software
  document.getElementById('iconWrap').style.setProperty('--accent', (ACCENTS[key] || ACCENTS.software) + '99')
</script>
</body>
</html>
